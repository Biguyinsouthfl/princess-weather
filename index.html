<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Calendar Station</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        /* Text Stroke / Outline Class */
        .outlined-num {
            -webkit-text-stroke: 1px #a0a6b0;
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        /* Top Header Row */
        .header-row {
            display: flex;
            height: 12vh;
            gap: 10px;
            width: 100%;
        }
        .header-box {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
        }

        /* Local Time Box */
        .time-box {
            width: 18vw;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock {
            font-size: 2.7vw;
            font-weight: 800;
            white-space: nowrap;
            transition: color 0.5s ease;
        }
        .clock.daytime {
            color: #f1c40f; /* Bright Yellow */
        }
        .clock.nighttime {
            color: #58a6ff; /* Light Blue */
        }
        .date {
            font-size: 1vw;
            color: #8b949e;
            font-weight: 600;
        }

        /* Hourly Forecast Box */
        .hourly-box {
            flex: 1;
            justify-content: space-around;
        }
        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hourly-time { font-size: 0.8vw; color: #8b949e; font-weight: 600; }
        .hourly-temp { font-size: 1.4vw; font-weight: 800; }
        .hourly-pop { font-size: 0.75vw; color: #58a6ff; font-weight: 700; }

        /* Local Temp Box */
        .local-temp-box {
            width: 22vw;
            justify-content: center;
            align-items: center;
        }
        .temp-container {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .temp-val-primary {
            font-size: 3.5vw;
            font-weight: 900;
            line-height: 1;
        }
        .temp-slash {
            font-size: 2.8vw;
            color: #8b949e;
            font-weight: 700;
        }
        .temp-val-secondary {
            font-size: 2.6vw;
            font-weight: 800;
            line-height: 1;
        }

        /* Main Grid Layout */
        .main-grid {
            display: flex;
            gap: 10px;
            width: 100%;
            height: 85vh;
        }

        /* Left Column */
        .left-side {
            width: 63vw;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        /* Radar Map Box */
        .map-box {
            height: 58vh;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .map-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bottom Row Under Radar */
        .bottom-row {
            height: 25vh;
            display: flex;
            gap: 10px;
        }

        /* YouTube Live Stream Box */
        .youtube-box {
            width: 22vw;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .youtube-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Remote Temps Box (Anthem & Riyadh) */
        .remote-box {
            width: 20vw;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .remote-label {
            font-size: 0.8vw;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .remote-temp-container {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .remote-primary {
            font-size: 2.2vw;
            font-weight: 900;
            line-height: 1;
        }
        .remote-slash {
            font-size: 1.6vw;
            color: #8b949e;
            font-weight: 700;
        }
        .remote-secondary {
            font-size: 1.7vw;
            font-weight: 800;
            line-height: 1;
        }

        /* Enlarged Wind Dial Box */
        .wind-box {
            flex: 1;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }
        .compass {
            width: 8.5vw;
            height: 8.5vw;
            border: 4px solid #58a6ff; /* High-contrast blue border */
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #f0f6fc;
            background: rgba(22, 27, 34, 0.8);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }
        .compass-n { position: absolute; top: 2px; font-size: 0.9vw; }
        .compass-s { position: absolute; bottom: 2px; font-size: 0.9vw; }
        .compass-w { position: absolute; left: 4px; font-size: 0.9vw; }
        .compass-e { position: absolute; right: 4px; font-size: 0.9vw; }
        
        .wind-arrow-wrapper {
            width: 5vw;
            height: 5vw;
            transition: transform 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wind-arrow-svg {
            width: 100%;
            height: 100%;
            fill: #58a6ff;
            filter: drop-shadow(0px 0px 3px #000);
        }

        .wind-text { 
            font-size: 2.1vw; 
            font-weight: 900; 
            line-height: 1;
        }

        /* Right Column (Google Calendar) */
        .right-side {
            width: 35vw;
            height: 100%;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .calendar-frame {
            width: 80%;
            height: 80%;
            border: none;
            filter: invert(90%) hue-rotate(180deg);
            transform: scale(1.25);
            transform-origin: 0 0;
        }
    </style>
</head>
<body>

    <!-- Top Header Row -->
    <div class="header-row">
        <div class="header-box time-box">
            <div class="clock outlined-num daytime" id="clock">--:-- --</div>
            <div class="date" id="date">Loading...</div>
        </div>
        <div class="header-box hourly-box" id="hourly-forecast"></div>
        <div class="header-box local-temp-box">
            <div class="temp-container">
                <span class="temp-val-primary outlined-num" id="local-temp-main">--°</span>
                <span class="temp-slash">/</span>
                <span class="temp-val-secondary outlined-num" id="local-temp-heat">--°</span>
            </div>
        </div>
    </div>

    <!-- Main Grid View -->
    <div class="main-grid">
        <div class="left-side">
            <div class="map-box">
                <iframe src="https://embed.windy.com/embed2.html?lat=26.3181&lon=-80.1258&detailLat=26.3181&detailLon=-80.1258&zoom=9&level=surface&overlay=radar&product=radar&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"></iframe>
            </div>
            <div class="bottom-row">
                <div class="youtube-box">
                    <iframe src="https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <div class="remote-box">
                    <div>
                        <div class="remote-label">Anthem, AZ Temp</div>
                        <div class="remote-temp-container">
                            <span class="remote-primary outlined-num" id="anthem-temp-main">--°</span>
                            <span class="remote-slash">/</span>
                            <span class="remote-secondary outlined-num" id="anthem-temp-heat">--°</span>
                        </div>
                    </div>
                    <div>
                        <div class="remote-label">Riyadh, Saudi Arabia Temp</div>
                        <div class="remote-temp-container">
                            <span class="remote-primary outlined-num" id="riyadh-temp-main">--°</span>
                            <span class="remote-slash">/</span>
                            <span class="remote-secondary outlined-num" id="riyadh-temp-heat">--°</span>
                        </div>
                    </div>
                </div>
                <div class="wind-box">
                    <div class="compass">
                        <span class="compass-n">N</span>
                        <span class="compass-s">S</span>
                        <span class="compass-w">W</span>
                        <span class="compass-e">E</span>
                        <div class="wind-arrow-wrapper" id="wind-arrow-wrapper">
                            <svg class="wind-arrow-svg" viewBox="0 0 24 24">
                                <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="wind-text outlined-num" id="wind-display">-- / -- mph</div>
                </div>
            </div>
        </div>
        <div class="right-side">
            <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23ffffff&src=tominsouthfl%40gmail.com&color=%23039BE5"></iframe>
        </div>
    </div>

    <script>
        const LOCAL_LAT = 26.3181;
        const LOCAL_LON = -80.1258;
        const ANTHEM_LAT = 33.8647;
        const ANTHEM_LON = -112.1382;
        const RIYADH_LAT = 24.7136;
        const RIYADH_LON = 46.6753;

        let sunriseTime = null;
        let sunsetTime = null;

        function getDynamicColor(value) {
            if (value <= 59) return '#ffffff';
            if (value <= 69) return '#87ceeb';
            if (value <= 79) return '#f1c40f';
            if (value <= 89) return '#e67e22';
            if (value <= 99) return '#e74c3c';
            return '#800000';
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            const clockEl = document.getElementById('clock');
            clockEl.textContent = `${hours}:${minutes} ${ampm}`;
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

            if (sunriseTime && sunsetTime) {
                if (now >= sunriseTime && now < sunsetTime) {
                    clockEl.classList.add('daytime');
                    clockEl.classList.remove('nighttime');
                } else {
                    clockEl.classList.add('nighttime');
                    clockEl.classList.remove('daytime');
                }
            } else {
                const currentHour = now.getHours();
                if (currentHour >= 6 && currentHour < 19) {
                    clockEl.classList.add('daytime');
                    clockEl.classList.remove('nighttime');
                } else {
                    clockEl.classList.add('nighttime');
                    clockEl.classList.remove('daytime');
                }
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const localRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOCAL_LAT}&longitude=${LOCAL_LON}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability&daily=sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`);
                const localData = await localRes.json();

                if (localData.daily && localData.daily.sunrise && localData.daily.sunset) {
                    sunriseTime = new Date(localData.daily.sunrise[0]);
                    sunsetTime = new Date(localData.daily.sunset[0]);
                    updateClock();
                }

                // Local Main Temp and Heat Index
                const lTemp = Math.round(localData.current.temperature_2m);
                const lApparent = Math.round(localData.current.apparent_temperature);
                
                const mainEl = document.getElementById('local-temp-main');
                const heatEl = document.getElementById('local-temp-heat');
                
                mainEl.textContent = `${lTemp}°`;
                mainEl.style.color = getDynamicColor(lTemp);
                
                heatEl.textContent = `${lApparent}°`;
                heatEl.style.color = getDynamicColor(lApparent);

                // Wind Dial and Speed Values
                const wSpeed = Math.round(localData.current.wind_speed_10m);
                const wGust = Math.round(localData.current.wind_gusts_10m);
                const wDir = localData.current.wind_direction_10m;

                const windEl = document.getElementById('wind-display');
                windEl.textContent = `${wSpeed} / ${wGust} mph`;
                windEl.style.color = getDynamicColor(wSpeed);
                document.getElementById('wind-arrow-wrapper').style.transform = `rotate(${wDir}deg)`;

                // Hourly Forecast
                const hourlyContainer = document.getElementById('hourly-forecast');
                hourlyContainer.innerHTML = '';
                const currentHour = new Date().getHours();

                for (let i = 0; i < 6; i++) {
                    const idx = currentHour + i;
                    const timeStr = new Date(localData.hourly.time[idx]).toLocaleTimeString([], { hour: 'numeric' });
                    const hTemp = Math.round(localData.hourly.temperature_2m[idx]);
                    const hPop = localData.hourly.precipitation_probability[idx];

                    const item = document.createElement('div');
                    item.className = 'hourly-item';
                    item.innerHTML = `
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-temp outlined-num" style="color: ${getDynamicColor(hTemp)}">${hTemp}°</div>
                        <div class="hourly-pop">💧 ${hPop}%</div>
                    `;
                    hourlyContainer.appendChild(item);
                }

                // Anthem Temp
                const anthemRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ANTHEM_LAT}&longitude=${ANTHEM_LON}&current=temperature_2m,apparent_temperature&temperature_unit=fahrenheit&timezone=auto`);
                const anthemData = await anthemRes.json();
                const aTemp = Math.round(anthemData.current.temperature_2m);
                const aApparent = Math.round(anthemData.current.apparent_temperature);
                
                const aMain = document.getElementById('anthem-temp-main');
                const aHeat = document.getElementById('anthem-temp-heat');
                aMain.textContent = `${aTemp}°`;
                aMain.style.color = getDynamicColor(aTemp);
                aHeat.textContent = `${aApparent}°`;
                aHeat.style.color = getDynamicColor(aApparent);

                // Riyadh Temp
                const riyadhRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${RIYADH_LAT}&longitude=${RIYADH_LON}&current=temperature_2m,apparent_temperature&temperature_unit=fahrenheit&timezone=auto`);
                const riyadhData = await riyadhRes.json();
                const rTemp = Math.round(riyadhData.current.temperature_2m);
                const rApparent = Math.round(riyadhData.current.apparent_temperature);
                
                const rMain = document.getElementById('riyadh-temp-main');
                const rHeat = document.getElementById('riyadh-temp-heat');
                rMain.textContent = `${rTemp}°`;
                rMain.style.color = getDynamicColor(rTemp);
                rHeat.textContent = `${rApparent}°`;
                rHeat.style.color = getDynamicColor(rApparent);

            } catch (err) {
                console.error("Weather data fetch error:", err);
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 300000);
    </script>
</body>
</html>
