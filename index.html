<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>Weather & Calendar Station</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            height: 1080px;
            width: 1920px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        /* Top Header Row */
        .header-row {
            display: flex;
            height: 110px;
            gap: 15px;
        }
        .header-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* Time Box */
        .time-box {
            width: 320px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock {
            font-size: 2.3rem;
            font-weight: 700;
            color: #58a6ff;
            letter-spacing: -1px;
            white-space: nowrap;
        }
        .date {
            font-size: 1rem;
            color: #8b949e;
        }

        /* Temp & Wind Display Cards */
        .temp-card {
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }
        .card-label {
            font-size: 0.9rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .temp-val {
            font-size: 2rem;
            font-weight: 800;
        }
        .wind-val {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wind-arrow {
            display: inline-block;
            transition: transform 0.5s ease;
        }

        /* NWS Alert Bar */
        .alert-bar {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 45px;
        }
        .alert-active {
            background: #781212 !important;
            border-color: #f85149 !important;
            color: #ffffff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.75; }
            100% { opacity: 1; }
        }

        /* Fixed Grid Dimensions */
        .main-grid {
            display: grid;
            grid-template-columns: 1100px 760px;
            gap: 15px;
            height: 865px;
            width: 1890px;
        }

        /* Left Column: Radar & Forecast */
        .left-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 865px;
        }
        .map-container {
            height: 700px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hourly-container {
            height: 150px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            border-right: 1px solid #21262d;
        }
        .hourly-item:last-child { border-right: none; }
        .hourly-time { font-size: 0.85rem; color: #8b949e; }
        .hourly-temp { font-size: 1.1rem; font-weight: 700; }
        .hourly-pop { font-size: 0.8rem; color: #58a6ff; }

        /* Right Column: Google Calendar Agenda */
        .right-col {
            height: 865px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
        }
        .calendar-frame {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(90%) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- Top Status Bar -->
    <div class="header-row">
        <div class="header-card time-box">
            <div class="clock" id="clock">--:-- --</div>
            <div class="date" id="date">Loading...</div>
        </div>

        <div class="header-card temp-card">
            <div class="card-label">Deerfield Beach (Temp / Heat Index)</div>
            <div class="temp-val" id="local-temp">--° / --°</div>
        </div>

        <div class="header-card temp-card">
            <div class="card-label">Remote Location (Temp / Heat Index)</div>
            <div class="temp-val" id="remote-temp">--° / --°</div>
        </div>

        <div class="header-card temp-card">
            <div class="card-label">Wind / Gusts</div>
            <div class="wind-val" id="wind-display">
                <span class="wind-arrow" id="wind-arrow">↑</span>
                <span id="wind-text">-- / -- mph</span>
            </div>
        </div>
    </div>

    <!-- Active NWS Weather Alerts -->
    <div class="alert-bar" id="alert-bar">
        <span>⚠️ Alerts:</span> <span id="alert-text">No active weather hazards for Deerfield Beach.</span>
    </div>

    <!-- Main Grid View -->
    <div class="main-grid">
        <!-- Left Column: Radar Map & Forecast -->
        <div class="left-col">
            <div class="map-container">
                <iframe src="https://embed.windy.com/embed2.html?lat=26.3181&lon=-80.1258&detailLat=26.3181&detailLon=-80.1258&width=650&height=450&zoom=9&level=surface&overlay=radar&product=radar&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"></iframe>
            </div>

            <div class="hourly-container" id="hourly-forecast">
                <!-- Populated via JavaScript -->
            </div>
        </div>

        <!-- Right Column: Google Calendar -->
        <div class="right-col">
            <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&height=800&wkst=1&bgcolor=%23ffffff&src=tominsouthfl%40gmail.com&color=%23039BE5"></iframe>
        </div>
    </div>

    <script>
        const LOCAL_LAT = 26.3181;
        const LOCAL_LON = -80.1258;
        const REMOTE_LAT = 34.0522;
        const REMOTE_LON = -118.2437;

        function getTemperatureColor(temp) {
            if (temp <= 32) return '#ffffff';
            if (temp <= 60) return '#87ceeb';
            if (temp <= 75) return '#2ecc71';
            if (temp <= 85) return '#f1c40f';
            if (temp <= 95) return '#e67e22';
            if (temp <= 105) return '#e74c3c';
            return '#800000';
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const localRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOCAL_LAT}&longitude=${LOCAL_LON}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`);
                const localData = await localRes.json();
                
                const remoteRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${REMOTE_LAT}&longitude=${REMOTE_LON}&current=temperature_2m,apparent_temperature&temperature_unit=fahrenheit&timezone=auto`);
                const remoteData = await remoteRes.json();

                const lTemp = Math.round(localData.current.temperature_2m);
                const lApparent = Math.round(localData.current.apparent_temperature);
                const lEl = document.getElementById('local-temp');
                lEl.textContent = `${lTemp}° / ${lApparent}°`;
                lEl.style.color = getTemperatureColor(lTemp);

                const rTemp = Math.round(remoteData.current.temperature_2m);
                const rApparent = Math.round(remoteData.current.apparent_temperature);
                const rEl = document.getElementById('remote-temp');
                rEl.textContent = `${rTemp}° / ${rApparent}°`;
                rEl.style.color = getTemperatureColor(rTemp);

                const wSpeed = Math.round(localData.current.wind_speed_10m);
                const wGust = Math.round(localData.current.wind_gusts_10m);
                const wDir = localData.current.wind_direction_10m;
                
                document.getElementById('wind-text').textContent = `${wSpeed} / ${wGust} mph`;
                document.getElementById('wind-arrow').style.transform = `rotate(${wDir}deg)`;
                document.getElementById('wind-display').style.color = getTemperatureColor(wSpeed + 50);

                const hourlyContainer = document.getElementById('hourly-forecast');
                hourlyContainer.innerHTML = '';
                const currentHour = new Date().getHours();
                
                for (let i = 0; i < 6; i++) {
                    const idx = currentHour + i;
                    const timeStr = new Date(localData.hourly.time[idx]).toLocaleTimeString([], { hour: 'numeric' });
                    const hTemp = Math.round(localData.hourly.temperature_2m[idx]);
                    const hPop = localData.hourly.precipitation_probability[idx];

                    const item = document.createElement('div');
                    item.className = 'hourly-item';
                    item.innerHTML = `
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-temp" style="color: ${getTemperatureColor(hTemp)}">${hTemp}°</div>
                        <div class="hourly-pop">💧 ${hPop}%</div>
                    `;
                    hourlyContainer.appendChild(item);
                }

            } catch (err) {
                console.error("Weather fetch failed:", err);
            }
        }

        async function fetchNWSAlerts() {
            try {
                const res = await fetch(`https://api.weather.gov/alerts/active?point=${LOCAL_LAT},${LOCAL_LON}`, {
                    headers: { 'User-Agent': 'WeatherStationDashboard/1.0' }
                });
                const data = await res.json();
                const alertBar = document.getElementById('alert-bar');
                const alertText = document.getElementById('alert-text');

                if (data.features && data.features.length > 0) {
                    const headline = data.features[0].properties.headline || data.features[0].properties.event;
                    alertText.textContent = headline;
                    alertBar.classList.add('alert-active');
                } else {
                    alertText.textContent = "No active weather hazards for Deerfield Beach.";
                    alertBar.classList.remove('alert-active');
                }
            } catch (err) {
                console.error("NWS alert fetch failed:", err);
            }
        }

        fetchWeather();
        fetchNWSAlerts();
        setInterval(fetchWeather, 300000);
        setInterval(fetchNWSAlerts, 300000);
    </script>
</body>
</html>
