<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Calendar Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            padding: 5px;
        }

        /* Main Container Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 120px 1fr 140px;
            gap: 6px;
            height: 100vh;
        }

        /* General Box Styling */
        .box {
            background-color: #111111;
            border: 2px solid #333333;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Row Layout */
        .top-row-container {
            grid-column: 1 / 2;
            display: grid;
            grid-template-columns: 1fr 2.5fr 1fr;
            gap: 6px;
        }

        /* Maximize Large Numbers with White Outline */
        .big-number {
            font-size: 68px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -1px;
            -webkit-text-stroke: 1.5px #FFFFFF;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
        }

        /* Hourly Forecast Styling */
        .hourly-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            align-items: center;
        }
        .hourly-item {
            text-align: center;
        }
        .hourly-time {
            font-size: 14px;
            color: #AAAAAA;
            margin-bottom: 2px;
        }
        .hourly-temp {
            font-size: 26px;
            font-weight: bold;
            -webkit-text-stroke: 0.8px #FFFFFF;
        }
        .hourly-pop {
            font-size: 13px;
            color: #00FFFF;
            margin-top: 2px;
        }

        /* Map Section */
        .map-box {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            padding: 0;
        }
        iframe.windy-map {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bottom Row Left Section */
        .bottom-left-container {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 6px;
        }

        .city-label {
            font-size: 14px;
            color: #CCCCCC;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .medium-temp {
            font-size: 42px;
            font-weight: bold;
            -webkit-text-stroke: 1px #FFFFFF;
        }

        /* YouTube Container */
        .yt-box {
            padding: 0;
        }
        .yt-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Cozi Calendar Right Panel Frame */
        .calendar-box {
            grid-column: 2 / 3;
            grid-row: 1 / 4;
            padding: 0;
            background-color: #080808;
            border: 2px solid #444444;
        }
        .cozi-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #FFFFFF;
        }

        /* Blinking Alert Animation for Weather Warnings */
        @keyframes alert-blink {
            0% { border-color: #FF0000; background-color: #330000; }
            50% { border-color: #FFFF00; background-color: #111111; }
            100% { border-color: #FF0000; background-color: #330000; }
        }
        .alert-active {
            animation: alert-blink 1.5s infinite;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Top Row -->
        <div class="top-row-container">
            <!-- Local Time -->
            <div class="box">
                <div id="local-time" class="big-number" style="color: #FFFFFF;">--:--</div>
            </div>

            <!-- 6-Hour Hourly Forecast -->
            <div class="box">
                <div class="hourly-container" id="hourly-forecast">
                    <!-- Dynamic hourly forecast rendered here -->
                </div>
            </div>

            <!-- Local Temp -->
            <div class="box" id="local-temp-box">
                <div id="local-temp" class="big-number">--°</div>
            </div>
        </div>

        <!-- Middle: Weather Map -->
        <div class="box map-box">
            <iframe class="windy-map" src="https://embed.windy.com/embed2.html?lat=26.318&lon=-80.099&detailLat=26.318&detailLon=-80.099&width=650&height=450&zoom=8&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=%C2%B0F&radarRange=-1"></iframe>
        </div>

        <!-- Bottom Left Row -->
        <div class="bottom-left-container">
            <!-- YouTube Stream -->
            <div class="box yt-box">
                <iframe src="https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1" allow="autoplay"></iframe>
            </div>

            <!-- Anthem, AZ Temp -->
            <div class="box" id="anthem-temp-box">
                <div class="city-label">Anthem, AZ</div>
                <div id="anthem-temp" class="medium-temp">--°</div>
            </div>

            <!-- Riyadh Temp -->
            <div class="box" id="riyadh-temp-box">
                <div class="city-label">Riyadh</div>
                <div id="riyadh-temp" class="medium-temp">--°</div>
            </div>
        </div>

        <!-- Right Side Column: Embedded Cozi Web View -->
        <div class="box calendar-box">
            <iframe class="cozi-frame" src="https://my.cozi.com/"></iframe>
        </div>
    </div>

    <script>
        // Temperature Color Scaling
        function getTempColor(temp) {
            if (temp <= 59) return "#FFFFFF"; // White
            if (temp <= 69) return "#87CEEB"; // Light Blue
            if (temp <= 79) return "#FFFF00"; // Yellow
            if (temp <= 89) return "#FFA500"; // Orange
            if (temp <= 99) return "#FF0000"; // Red
            return "#800000";                  // Maroon
        }

        function applyTempStyle(elementId, tempValue) {
            const el = document.getElementById(elementId);
            if (el && !isNaN(tempValue)) {
                const rounded = Math.round(tempValue);
                el.innerText = rounded + "°";
                el.style.color = getTempColor(rounded);
            }
        }

        // Clock Update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12;
            document.getElementById("local-time").innerText = hours + ":" + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // NWS Active Alert Check (Deerfield Beach Area)
        async function checkWeatherAlerts() {
            try {
                const response = await fetch('https://api.weather.gov/alerts/active?point=26.3184,-80.0997');
                const data = await response.json();
                const tempBox = document.getElementById("local-temp-box");

                // Filter out marine/ocean alerts
                const landAlerts = data.features.filter(alert => {
                    const eventName = alert.properties.event.toLowerCase();
                    return !eventName.includes("marine") && !eventName.includes("rip current") && !eventName.includes("surf") && !eventName.includes("coastal");
                });

                if (landAlerts.length > 0) {
                    tempBox.classList.add("alert-active");
                } else {
                    tempBox.classList.remove("alert-active");
                }
            } catch (err) {
                console.error("Alert fetch failed:", err);
            }
        }
        setInterval(checkWeatherAlerts, 300000); // Check every 5 mins
        checkWeatherAlerts();

        // Local Weather Fetch (NWS)
        async function fetchLocalWeather() {
            try {
                // Deerfield Beach Grid Endpoint
                const gridRes = await fetch('https://api.weather.gov/gridpoints/MFL/110,72');
                const gridData = await gridRes.json();
                
                // Current Temp (convert C to F)
                const currentC = gridData.properties.temperature.values[0].value;
                const currentF = (currentC * 9/5) + 32;
                applyTempStyle("local-temp", currentF);

                // Hourly Forecast (Next 6 Hours)
                const forecastRes = await fetch('https://api.weather.gov/gridpoints/MFL/110,72/forecast/hourly');
                const forecastData = await forecastRes.json();
                const periods = forecastData.properties.periods.slice(0, 6);

                const hourlyContainer = document.getElementById("hourly-forecast");
                hourlyContainer.innerHTML = "";

                periods.forEach(p => {
                    const timeStr = new Date(p.startTime).toLocaleTimeString([], { hour: 'numeric' });
                    const pop = p.probabilityOfPrecipitation.value || 0;
                    const tempColor = getTempColor(p.temperature);

                    const item = document.createElement("div");
                    item.className = "hourly-item";
                    item.innerHTML = `
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-temp" style="color: ${tempColor};">${p.temperature}°</div>
                        <div class="hourly-pop">${pop}%</div>
                    `;
                    hourlyContainer.appendChild(item);
                });

            } catch (err) {
                console.error("Local weather fetch failed:", err);
            }
        }
        setInterval(fetchLocalWeather, 600000); // Refresh every 10 mins
        fetchLocalWeather();

        // Fetch Remote City Temperatures (Open-Meteo API)
        async function fetchRemoteTemps() {
            try {
                // Anthem, AZ (33.8642, -112.1399)
                const anthemRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.8642&longitude=-112.1399&current_weather=true&temperature_unit=fahrenheit');
                const anthemData = await anthemRes.json();
                applyTempStyle("anthem-temp", anthemData.current_weather.temperature);

                // Riyadh, Saudi Arabia (24.7136, 46.6753)
                const riyadhRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.7136&longitude=46.6753&current_weather=true&temperature_unit=fahrenheit');
                const riyadhData = await riyadhRes.json();
                applyTempStyle("riyadh-temp", riyadhData.current_weather.temperature);
            } catch (err) {
                console.error("Remote temps fetch failed:", err);
            }
        }
        setInterval(fetchRemoteTemps, 600000);
        fetchRemoteTemps();
    </script>
</body>
</html>
