<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Calendar Station</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: #000000; color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; overflow-x: hidden; }

        .page-section { width: 100vw; height: 100vh; padding: 6px; }

        /* Dashboard & Box Styles */
        .dashboard { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 120px 1fr 140px; gap: 6px; height: 100%; }
        .box { background-color: #111111; border: 2px solid #333333; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        
        .top-row-container { grid-column: 1 / 2; display: grid; grid-template-columns: 1fr 2.5fr 1fr; gap: 6px; }
        .big-number { font-size: 68px; font-weight: 900; line-height: 1; letter-spacing: -1px; -webkit-text-stroke: 1.5px #FFFFFF; text-shadow: 0 0 3px rgba(255, 255, 255, 0.4); }

        .hourly-container { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        .hourly-item { text-align: center; }
        .hourly-time { font-size: 14px; color: #AAAAAA; margin-bottom: 2px; }
        .hourly-temp { font-size: 26px; font-weight: bold; -webkit-text-stroke: 0.8px #FFFFFF; }
        .hourly-pop { font-size: 13px; color: #00FFFF; margin-top: 2px; }

        .map-box { grid-column: 1 / 2; grid-row: 2 / 3; padding: 0; }
        iframe.windy-map { width: 100%; height: 100%; border: none; }

        .bottom-left-container { grid-column: 1 / 2; grid-row: 3 / 4; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; }
        .city-label { font-size: 14px; color: #CCCCCC; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .medium-temp { font-size: 42px; font-weight: bold; -webkit-text-stroke: 1px #FFFFFF; }

        .yt-box { padding: 0; }
        .yt-box iframe { width: 100%; height: 100%; border: none; }

        .wind-box { grid-column: 2 / 3; grid-row: 1 / 4; display: flex; flex-direction: column; justify-content: space-around; align-items: center; background-color: #080808; border: 2px solid #444444; padding: 15px; }
        .wind-title { font-size: 18px; font-weight: bold; color: #AAAAAA; letter-spacing: 2px; text-transform: uppercase; }

        .compass-dial { position: relative; width: 230px; height: 230px; border: 4px solid #333333; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #151515 0%, #000000 80%); box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .compass-point { position: absolute; font-weight: bold; color: #888888; font-size: 14px; }
        .point-n  { top: 6px; color: #FF4444; font-size: 18px; font-weight: 900; }
        .point-s  { bottom: 6px; }
        .point-e  { right: 10px; }
        .point-w  { left: 10px; }
        .point-ne { top: 25px; right: 28px; font-size: 11px; }
        .point-nw { top: 25px; left: 28px; font-size: 11px; }
        .point-se { bottom: 25px; right: 28px; font-size: 11px; }
        .point-sw { bottom: 25px; left: 28px; font-size: 11px; }

        .compass-arrow-container { position: absolute; width: 100%; height: 100%; transition: transform 1s ease-in-out; display: flex; justify-content: center; align-items: center; }
        .compass-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 85px solid #00FFFF; position: absolute; top: 25px; filter: drop-shadow(0px 0px 4px #00FFFF); }
        .compass-center-dot { width: 16px; height: 16px; background-color: #FFFFFF; border-radius: 50%; z-index: 10; }

        .wind-readout { text-align: center; }
        .wind-speed { font-size: 64px; font-weight: 900; line-height: 1; -webkit-text-stroke: 1px #FFFFFF; }
        .wind-unit { font-size: 14px; color: #AAAAAA; letter-spacing: 1px; margin-top: 4px; }

        /* Calendar Section */
        .calendar-section { padding: 0; background-color: #111111; }
        .google-calendar-frame { width: 100%; height: 100%; border: none; filter: invert(90%) hue-rotate(180deg); /* Dark mode effect */ }

        @keyframes alert-blink {
            0% { border-color: #FF0000; background-color: #330000; }
            50% { border-color: #FFFF00; background-color: #111111; }
            100% { border-color: #FF0000; background-color: #330000; }
        }
        .alert-active { animation: alert-blink 1.5s infinite; }
    </style>
</head>
<body>

    <!-- SLIDE 1: WEATHER DASHBOARD -->
    <div class="page-section" id="weather-page">
        <div class="dashboard">
            <div class="top-row-container">
                <div class="box">
                    <div id="local-time" class="big-number" style="color: #FFFFFF;">--:--</div>
                </div>
                <div class="box">
                    <div class="hourly-container" id="hourly-forecast"></div>
                </div>
                <div class="box" id="local-temp-box">
                    <div id="local-temp" class="big-number">--°</div>
                </div>
            </div>

            <div class="box map-box">
                <iframe class="windy-map" src="https://embed.windy.com/embed2.html?lat=26.318&lon=-80.099&detailLat=26.318&detailLon=-80.099&width=650&height=450&zoom=8&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=%C2%B0F&radarRange=-1"></iframe>
            </div>

            <div class="bottom-left-container">
                <div class="box yt-box">
                    <iframe src="https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1" allow="autoplay"></iframe>
                </div>
                <div class="box" id="anthem-temp-box">
                    <div class="city-label">Anthem, AZ</div>
                    <div id="anthem-temp" class="medium-temp">--°</div>
                </div>
                <div class="box" id="riyadh-temp-box">
                    <div class="city-label">Riyadh</div>
                    <div id="riyadh-temp" class="medium-temp">--°</div>
                </div>
            </div>

            <div class="box wind-box">
                <div class="wind-title">WIND CONDITIONS</div>
                <div class="compass-dial">
                    <div class="compass-point point-n">N</div>
                    <div class="compass-point point-ne">NE</div>
                    <div class="compass-point point-e">E</div>
                    <div class="compass-point point-se">SE</div>
                    <div class="compass-point point-s">S</div>
                    <div class="compass-point point-sw">SW</div>
                    <div class="compass-point point-w">W</div>
                    <div class="compass-point point-nw">NW</div>
                    <div class="compass-arrow-container" id="compass-arrow">
                        <div class="compass-arrow"></div>
                    </div>
                    <div class="compass-center-dot"></div>
                </div>
                <div class="wind-readout">
                    <div id="wind-speed" class="wind-speed">0</div>
                    <div class="wind-unit" id="wind-dir-text">MPH</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SLIDE 2: FULL SCREEN GOOGLE CALENDAR (AGENDA VIEW) -->
    <div class="page-section calendar-section" id="calendar-page">
        <!-- Replace YOUR_CALENDAR_ID below with your actual Google Calendar ID/email -->

        <iframe class="google-calendar-frame" src="https://calendar.google.com/calendar/embed?mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&height=800&wkst=1&bgcolor=%23ffffff&src=tominsouthfl@gmail.com&color=%23039BE5"></iframe>
    </div>

    <script>
        let currentSlide = 0;
        function toggleSlides() {
            if (currentSlide === 0) {
                document.getElementById('calendar-page').scrollIntoView({ behavior: 'smooth' });
                currentSlide = 1;
            } else {
                document.getElementById('weather-page').scrollIntoView({ behavior: 'smooth' });
                currentSlide = 0;
            }
        }
        setInterval(toggleSlides, 180000);

        function getTempColor(temp) {
            if (temp <= 59) return "#FFFFFF";
            if (temp <= 69) return "#87CEEB";
            if (temp <= 79) return "#FFFF00";
            if (temp <= 89) return "#FFA500";
            if (temp <= 99) return "#FF0000";
            return "#800000";
        }

        function getWindColor(speed) {
            if (speed <= 10) return "#FFFFFF";
            if (speed <= 20) return "#87CEEB";
            if (speed <= 30) return "#FFFF00";
            if (speed <= 40) return "#FFA500";
            if (speed <= 50) return "#FF0000";
            return "#800000";
        }

        function applyTempStyle(elementId, tempValue) {
            const el = document.getElementById(elementId);
            if (el && !isNaN(tempValue)) {
                const rounded = Math.round(tempValue);
                el.innerText = rounded + "°";
                el.style.color = getTempColor(rounded);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12;
            document.getElementById("local-time").innerText = hours + ":" + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchLocalWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=26.3184&longitude=-80.0997&current_weather=true&hourly=temperature_2m,precipitation_probability&temperature_unit=fahrenheit&windspeed_unit=mph&forecast_days=1');
                if (!res.ok) throw new Error("Weather API status " + res.status);
                const data = await res.json();

                const currentTemp = data.current_weather.temperature;
                applyTempStyle("local-temp", currentTemp);

                const speed = Math.round(data.current_weather.windspeed);
                const direction = data.current_weather.winddirection;
                
                const speedEl = document.getElementById("wind-speed");
                speedEl.innerText = speed;
                speedEl.style.color = getWindColor(speed);

                const arrow = document.getElementById("compass-arrow");
                arrow.style.transform = `rotate(${direction}deg)`;

                const hourlyContainer = document.getElementById("hourly-forecast");
                hourlyContainer.innerHTML = "";

                const currentHour = new Date().getHours();
                for (let i = currentHour; i < currentHour + 6; i++) {
                    if (!data.hourly.time[i]) break;

                    const timeDate = new Date(data.hourly.time[i]);
                    const timeStr = timeDate.toLocaleTimeString([], { hour: 'numeric' });
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const pop = data.hourly.precipitation_probability[i] || 0;
                    const tempColor = getTempColor(temp);

                    const item = document.createElement("div");
                    item.className = "hourly-item";
                    item.innerHTML = `
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-temp" style="color: ${tempColor};">${temp}°</div>
                        <div class="hourly-pop">${pop}%</div>
                    `;
                    hourlyContainer.appendChild(item);
                }
            } catch (err) {
                console.error("Local weather fetch error:", err);
            }
        }
        setInterval(fetchLocalWeather, 300000);
        fetchLocalWeather();

        async function fetchRemoteTemps() {
            try {
                const anthemRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.8642&longitude=-112.1399&current_weather=true&temperature_unit=fahrenheit');
                if (anthemRes.ok) {
                    const anthemData = await anthemRes.json();
                    applyTempStyle("anthem-temp", anthemData.current_weather.temperature);
                }

                const riyadhRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.7136&longitude=46.6753&current_weather=true&temperature_unit=fahrenheit');
                if (riyadhRes.ok) {
                    const riyadhData = await riyadhRes.json();
                    applyTempStyle("riyadh-temp", riyadhData.current_weather.temperature);
                }
            } catch (err) {
                console.error("Remote temps fetch error:", err);
            }
        }
        setInterval(fetchRemoteTemps, 600000);
        fetchRemoteTemps();

        async function checkWeatherAlerts() {
            try {
                const response = await fetch('https://api.weather.gov/alerts/active?point=26.3184,-80.0997', {
                    headers: { 'User-Agent': 'WeatherDashboard/1.0' }
                });
                if (!response.ok) return;
                
                const data = await response.json();
                const tempBox = document.getElementById("local-temp-box");

                const landAlerts = data.features.filter(alert => {
                    const eventName = alert.properties.event.toLowerCase();
                    return !eventName.includes("marine") && !eventName.includes("rip current") && !eventName.includes("surf") && !eventName.includes("coastal");
                });

                if (landAlerts.length > 0) {
                    tempBox.classList.add("alert-active");
                } else {
                    tempBox.classList.remove("alert-active");
                }
            } catch (err) {
                console.error("Alert check error:", err);
            }
        }
        setInterval(checkWeatherAlerts, 300000);
        checkWeatherAlerts();
    </script>
</body>
</html>
