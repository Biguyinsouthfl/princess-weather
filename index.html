<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather & Calendar Station</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html {
scroll-behavior: smooth;
}
body {
background-color: #000000;
color: #FFFFFF;
font-family: Arial, Helvetica, sans-serif;
overflow-x: hidden;
}
/* Full Screen Slide Sections */
.page-section {
width: 100vw;
height: 100vh;
padding: 6px;
}
/* Weather Dashboard Layout */
.dashboard {
display: grid;
grid-template-columns: 2fr 1fr;
grid-template-rows: 120px 1fr 140px;
gap: 6px;
height: 100%;
}
/* General Box Styling */
.box {
background-color: #111111;
border: 2px solid #333333;
border-radius: 6px;
padding: 6px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
position: relative;
overflow: hidden;
}
/* Top Row Layout */
.top-row-container {
grid-column: 1 / 2;
display: grid;
grid-template-columns: 1fr 2.5fr 1fr;
gap: 6px;
}
/* Big Numbers with Outline */
.big-number {
font-size: 68px;
font-weight: 900;
line-height: 1;
letter-spacing: -1px;
-webkit-text-stroke: 1.5px #FFFFFF;
text-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
}
/* Hourly Forecast Styling */
.hourly-container {
display: flex;
justify-content: space-around;
width: 100%;
align-items: center;
}
.hourly-item {
text-align: center;
}
.hourly-time {
font-size: 14px;
color: #AAAAAA;
margin-bottom: 2px;
}
.hourly-temp {
font-size: 26px;
font-weight: bold;
-webkit-text-stroke: 0.8px #FFFFFF;
}
.hourly-pop {
font-size: 13px;
color: #00FFFF;
margin-top: 2px;
}
/* Map Section */
.map-box {
grid-column: 1 / 2;
grid-row: 2 / 3;
padding: 0;
}
iframe.windy-map {
width: 100%;
height: 100%;
border: none;
}
/* Bottom Row Left Section */
.bottom-left-container {
grid-column: 1 / 2;
grid-row: 3 / 4;
display: grid;
grid-template-columns: 2fr 1fr 1fr;
gap: 6px;
}
.city-label {
font-size: 14px;
color: #CCCCCC;
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 4px;
}
.medium-temp {
font-size: 42px;
font-weight: bold;
-webkit-text-stroke: 1px #FFFFFF;
}
/* YouTube Container */
.yt-box {
padding: 0;
}
.yt-box iframe {
width: 100%;
height: 100%;
border: none;
}
/* WIND COMPASS RIGHT PANEL */
.wind-box {
grid-column: 2 / 3;
grid-row: 1 / 4;
display: flex;
flex-direction: column;
justify-content: space-around;
align-items: center;
background-color: #080808;
border: 2px solid #444444;
padding: 15px;
}
.wind-title {
font-size: 18px;
font-weight: bold;
color: #AAAAAA;
letter-spacing: 2px;
text-transform: uppercase;
}
.compass-dial {
position: relative;
width: 230px;
height: 230px;
border: 4px solid #333333;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
background: radial-gradient(circle, #151515 0%, #000000 80%);
box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}
.compass-point {
position: absolute;
font-weight: bold;
color: #888888;
font-size: 14px;
}
.point-n  { top: 6px; color: #FF4444; font-size: 18px; font-weight: 900; }
.point-s  { bottom: 6px; }
.point-e  { right: 10px; }
.point-w  { left: 10px; }
.point-ne { top: 25px; right: 28px; font-size: 11px; }
.point-nw { top: 25px; left: 28px; font-size: 11px; }
.point-se { bottom: 25px; right: 28px; font-size: 11px; }
.point-sw { bottom: 25px; left: 28px; font-size: 11px; }
/* Compass Arrow Pointer */
.compass-arrow-container {
position: absolute;
width: 100%;
height: 100%;
transition: transform 1s ease-in-out;
display: flex;
justify-content: center;
align-items: center;
}
.compass-arrow {
width: 0;
height: 0;
border-left: 10px solid transparent;
border-right: 10px solid transparent;
border-bottom: 85px solid #00FFFF;
position: absolute;
top: 25px;
filter: drop-shadow(0px 0px 4px #00FFFF);
}
.compass-center-dot {
width: 16px;
height: 16px;
background-color: #FFFFFF;
border-radius: 50%;
z-index: 10;
}
.wind-readout {
text-align: center;
}
.wind-speed {
font-size: 64px;
font-weight: 900;
line-height: 1;
-webkit-text-stroke: 1px #FFFFFF;
}
.wind-unit {
font-size: 14px;
color: #AAAAAA;
letter-spacing: 1px;
margin-top: 4px;
}
/* Section 2: Full Screen Calendar Frame */
.calendar-section {
padding: 0;
background-color: #000000;
}
.cozi-full-frame {
width: 100%;
height: 100%;
border: none;
background-color: #FFFFFF;
}
/* Blinking Alert Animation */
@keyframes alert-blink {
0% { border-color: #FF0000; background-color: #330000; }
50% { border-color: #FFFF00; background-color: #111111; }
100% { border-color: #FF0000; background-color: #330000; }
}
.alert-active {
animation: alert-blink 1.5s infinite;
}
</style>
</head>
<body>
<!-- SLIDE 1: WEATHER DASHBOARD -->
<div class="page-section" id="weather-page">
<div class="dashboard">
<!-- Top Row -->
<div class="top-row-container">
<div class="box">
<div id="local-time" class="big-number" style="color: #FFFFFF;">--:--</div>
</div>
<div class="box">
<div class="hourly-container" id="hourly-forecast"></div>
</div>
<div class="box" id="local-temp-box">
<div id="local-temp" class="big-number">--°</div>
</div>
</div>
<!-- Middle: Weather Map -->
<div class="box map-box">
<iframe class="windy-map" src="[https://embed.windy.com/embed2.html?lat=26.318&lon=-80.099&detailLat=26.318&detailLon=-80.099&width=650&height=450&zoom=8&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=%C2%B0F&radarRange=-1](https://embed.windy.com/embed2.html?lat=26.318&lon=-80.099&detailLat=26.318&detailLon=-80.099&width=650&height=450&zoom=8&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=%C2%B0F&radarRange=-1)"></iframe>
</div>
<!-- Bottom Left Row -->
<div class="bottom-left-container">
<div class="box yt-box">
<iframe src="[https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1](https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1)" allow="autoplay"></iframe>
</div>
<div class="box" id="anthem-temp-box">
<div class="city-label">Anthem, AZ</div>
<div id="anthem-temp" class="medium-temp">--°</div>
</div>
<div class="box" id="riyadh-temp-box">
<div class="city-label">Riyadh</div>
<div id="riyadh-temp" class="medium-temp">--°</div>
</div>
</div>
<!-- Right Side Column: Live Wind Indicator -->
<div class="box wind-box">
<div class="wind-title">WIND CONDITIONS</div>
<div class="compass-dial">
<div class="compass-point point-n">N</div>
<div class="compass-point point-ne">NE</div>
<div class="compass-point point-e">E</div>
<div class="compass-point point-se">SE</div>
<div class="compass-point point-s">S</div>
<div class="compass-point point-sw">SW</div>
<div class="compass-point point-w">W</div>
<div class="compass-point point-nw">NW</div>
<div class="compass-arrow-container" id="compass-arrow">
<div class="compass-arrow"></div>
</div>
<div class="compass-center-dot"></div>
</div>
<div class="wind-readout">
<div id="wind-speed" class="wind-speed">0</div>
<div class="wind-unit" id="wind-dir-text">MPH --</div>
</div>
</div>
</div>
</div>
<!-- SLIDE 2: FULL SCREEN COZI CALENDAR -->
<div class="page-section calendar-section" id="calendar-page">
<iframe class="cozi-full-frame" src="[https://my.cozi.com/](https://my.cozi.com/)"></iframe>
</div>
<script>
// Automatic Slide Toggler (Switches every 3 minutes)
let currentSlide = 0;
function toggleSlides() {
if (currentSlide === 0) {
document.getElementById('calendar-page').scrollIntoView({ behavior: 'smooth' });
currentSlide = 1;
} else {
document.getElementById('weather-page').scrollIntoView({ behavior: 'smooth' });
currentSlide = 0;
}
}
setInterval(toggleSlides, 180000); // 180000 ms = 3 minutes
// Temperature Color Scaling
function getTempColor(temp) {
if (temp <= 59) return "#FFFFFF";
if (temp <= 69) return "#87CEEB";
if (temp <= 79) return "#FFFF00";
if (temp <= 89) return "#FFA500";
if (temp <= 99) return "#FF0000";
return "#800000";
}
// Wind Speed Color Scaling
function getWindColor(speed) {
if (speed <= 10) return "#FFFFFF"; // White
if (speed <= 20) return "#87CEEB"; // Light Blue
if (speed <= 30) return "#FFFF00"; // Yellow
if (speed <= 40) return "#FFA500"; // Orange
if (speed <= 50) return "#FF0000"; // Red
return "#800000";                  // Maroon / Crimson
}
function applyTempStyle(elementId, tempValue) {
const el = document.getElementById(elementId);
if (el && !isNaN(tempValue)) {
const rounded = Math.round(tempValue);
el.innerText = rounded + "°";
el.style.color = getTempColor(rounded);
}
}
// Clock Update
function updateClock() {
const now = new Date();
let hours = now.getHours();
const minutes = String(now.getMinutes()).padStart(2, '0');
hours = hours % 12 || 12;
document.getElementById("local-time").innerText = hours + ":" + minutes;
}
setInterval(updateClock, 1000);
updateClock();
// Active Alert Check (Deerfield Beach Area)
async function checkWeatherAlerts() {
try {
const response = await fetch('https://api.weather.gov/alerts/active?point=26.3184,-80.0997');
const data = await response.json();
const tempBox = document.getElementById("local-temp-box");
const landAlerts = data.features.filter(alert => {
const eventName = alert.properties.event.toLowerCase();
return !eventName.includes("marine") && !eventName.includes("rip current") && !eventName.includes("surf") && !eventName.includes("coastal");
});
if (landAlerts.length > 0) {
tempBox.classList.add("alert-active");
} else {
tempBox.classList.remove("alert-active");
}
} catch (err) {
console.error("Alert fetch failed:", err);
}
}
setInterval(checkWeatherAlerts, 300000);
checkWeatherAlerts();
// Local Weather & Wind Fetch
async function fetchLocalWeather() {
try {
// Open-Meteo current conditions for exact live wind data
const windRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=26.3184&longitude=-80.0997&current_weather=true&windspeed_unit=mph');
const windData = await windRes.json();
const speed = Math.round(windData.current_weather.windspeed);
const direction = windData.current_weather.winddirection;
// Update Wind Speed Number & Color
const speedEl = document.getElementById("wind-speed");
speedEl.innerText = speed;
speedEl.style.color = getWindColor(speed);
// Rotate Compass Arrow Pointer
const arrow = document.getElementById("compass-arrow");
arrow.style.transform = ⁠rotate(${direction}deg)⁠;
// NWS Temperature & Hourly Forecast
const gridRes = await fetch('https://api.weather.gov/gridpoints/MFL/110,72');
const gridData = await gridRes.json();
const currentC = gridData.properties.temperature.values[0].value;
const currentF = (currentC * 9/5) + 32;
applyTempStyle("local-temp", currentF);
const forecastRes = await fetch('https://api.weather.gov/gridpoints/MFL/110,72/forecast/hourly');
const forecastData = await forecastRes.json();
const periods = forecastData.properties.periods.slice(0, 6);
const hourlyContainer = document.getElementById("hourly-forecast");
hourlyContainer.innerHTML = "";
periods.forEach(p => {
const timeStr = new Date(p.startTime).toLocaleTimeString([], { hour: 'numeric' });
const pop = p.probabilityOfPrecipitation.value || 0;
const tempColor = getTempColor(p.temperature);
const item = document.createElement("div");
item.className = "hourly-item";
item.innerHTML = ⁠<div class="hourly-time">${timeStr}</div> <div class="hourly-temp" style="color: ${tempColor};">${p.temperature}°</div> <div class="hourly-pop">${pop}%</div>⁠;
hourlyContainer.appendChild(item);
});
} catch (err) {
console.error("Local weather fetch failed:", err);
}
}
setInterval(fetchLocalWeather, 300000); // Refresh weather every 5 mins
fetchLocalWeather();
// Fetch Remote City Temperatures
async function fetchRemoteTemps() {
try {
const anthemRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.8642&longitude=-112.1399&current_weather=true&temperature_unit=fahrenheit');
const anthemData = await anthemRes.json();
applyTempStyle("anthem-temp", anthemData.current_weather.temperature);
const riyadhRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.7136&longitude=46.6753&current_weather=true&temperature_unit=fahrenheit');
const riyadhData = await riyadhRes.json();
applyTempStyle("riyadh-temp", riyadhData.current_weather.temperature);
} catch (err) {
console.error("Remote temps fetch failed:", err);
}
}
setInterval(fetchRemoteTemps, 600000);
fetchRemoteTemps();
</script>
</body>
</html>
