<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princess's Weather Command Station</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    padding: 8px;
}

/* PRINCESS LOGO FLOATING OVERLAY */
#princess {
    position: fixed;
    top: 10px;
    left: 10px;
    height: 55px;
    width: auto;
    z-index: 99999;
    pointer-events: none;
}

/* MASTER GRID LAYOUT MATCHING IMAGE 3 SKETCH */
.grid-container {
    display: grid;
    grid-template-rows: 18% 57% 25%; /* Top, Center, Bottom Rows */
    height: 100vh;
    gap: 8px;
}

/* ROW 1: TOP BANNER (TIME | HOURLY FORECAST | TEMP) */
.top-row {
    display: grid;
    grid-template-columns: 18% 64% 18%;
    gap: 8px;
    height: 100%;
}

/* ROW 2: CENTER (WINDY MAP | HURRICANE + NEWS STACK) */
.center-row {
    display: grid;
    grid-template-columns: 68% 32%;
    gap: 8px;
    height: 100%;
}

.right-stack {
    display: grid;
    grid-template-rows: 55% 45%;
    gap: 8px;
    height: 100%;
}

/* ROW 3: BOTTOM (2 WEBCAMS | 3 CITY TEMPS) */
.bottom-row {
    display: grid;
    grid-template-columns: 24% 24% 17.3% 17.3% 17.3%;
    gap: 8px;
    height: 100%;
}

/* COMMON CARD PANEL STYLING */
.box {
    background: #050505;
    border: 2px solid #45f3ff;
    border-radius: 8px;
    padding: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 100%;
}

.box-title {
    font-size: 11px;
    font-weight: bold;
    color: #45f3ff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

/* MAXIMIZED BIG NUMBERS FOR TIME AND TEMPERATURES */
.big-number {
    font-weight: 900;
    line-height: 0.95;
    font-size: clamp(28px, 6vh, 60px);
}

.top-big-temp, .top-big-time {
    font-size: clamp(32px, 7.5vh, 75px);
    font-weight: 900;
    line-height: 0.9;
}

/* HOURLY FORECAST DISPLAY BLOCK */
#hourly-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    height: 100%;
}

.hourly-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.hourly-time { font-size: 11px; color: #aaa; }
.hourly-temp { font-size: 18px; font-weight: bold; margin: 2px 0; }
.hourly-pop { font-size: 12px; color: #66ccff; font-weight: bold; }

/* NEWS TICKER */
#news-ticker {
    font-size: 13px;
    color: #ffffff;
    font-weight: bold;
    line-height: 1.3;
    transition: opacity 0.4s ease-in-out;
}

/* DYNAMIC TEMPERATURE COLOR THRESHOLDS */
.t-cold   { color: #ffffff !important; } /* <= 59 */
.t-cool   { color: #66ccff !important; } /* 60 - 69 */
.t-yellow { color: #ffd84d !important; } /* 70 - 79 */
.t-orange { color: #ff8c1a !important; } /* 80 - 89 */
.t-lred   { color: #ff6666 !important; } /* 90 - 99 */
.t-bred   { color: #ff0000 !important; } /* >= 100 */

.alert-active { color: #ff3333; font-weight: bold; animation: pulse 1.5s infinite; }
.alert-quiet { color: #00ff66; }

@keyframes pulse {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
}
</style>
</head>
<body>

<img id="princess" src="IMG_4728.png">

<div class="grid-container">

    <!-- ==================== TOP ROW ==================== -->
    <div class="top-row">
        <!-- Local Time -->
        <div class="box">
            <div class="box-title">Local Time</div>
            <div id="local-time" class="top-big-time" style="color: #ffffff;">--:--</div>
        </div>

        <!-- 6-Hour Hourly Forecast -->
        <div class="box">
            <div class="box-title" style="margin-bottom: 4px;">6-Hour Local Forecast (Time / Temp / Rain %)</div>
            <div id="hourly-container">
                <div style="color: #666; font-size: 12px;">Loading forecast timeline...</div>
            </div>
        </div>

        <!-- Local Temp -->
        <div class="box">
            <div class="box-title">Local Temp</div>
            <div id="local-temp" class="top-big-temp">--°</div>
        </div>
    </div>


    <!-- ==================== CENTER ROW ==================== -->
    <div class="center-row">
        <!-- Windy Radar Map -->
        <div class="box" style="padding: 0;">
            <iframe 
                src="https://embed.windy.com/embed2.html?lat=26.2972&lon=-80.1606&zoom=11&level=surface&overlay=rain&menu=&message=&marker=true&calendar=now&metricWind=default&metricTemp=%C2%B0F" 
                width="100%" height="100%" style="border: none;">
            </iframe>
        </div>

        <!-- Hurricane & News Stack -->
        <div class="right-stack">
            <!-- Hurricane Tracker -->
            <div class="box">
                <div class="box-title">Hurricane Tracker</div>
                <div id="caneCountdown" style="font-size: 12px; color: #bbb; margin-top: 2px;">Analyzing Season...</div>
                <div id="caneStormList" style="font-size: 12px; color: #ffd84d; margin: 4px 0;">Querying NOAA feeds...</div>
                <div id="caneStatus" class="alert-quiet" style="font-size: 16px; font-weight: bold;">✓ Basin Quiet</div>
            </div>

            <!-- Current Events Ticker -->
            <div class="box" style="border-color: #ff8c1a;">
                <div class="box-title" style="color: #ff8c1a;">US & World Headlines</div>
                <div id="news-ticker" style="margin-top: 4px;">Fetching global news network...</div>
            </div>
        </div>
    </div>


    <!-- ==================== BOTTOM ROW ==================== -->
    <div class="bottom-row">
        <!-- YouTube Cam 1 -->
        <div class="box" style="padding: 0; background: #000;">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/rdeoEeJ00xA?autoplay=1&mute=1&modestbranding=1&rel=0" style="border: none;" allowfullscreen></iframe>
        </div>

        <!-- YouTube Cam 2 -->
        <div class="box" style="padding: 0; background: #000;">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/f9pMVLoJfyE?autoplay=1&mute=1&modestbranding=1&rel=0" style="border: none;" allowfullscreen></iframe>
        </div>

        <!-- Anthem AZ Temp -->
        <div class="box">
            <div class="box-title">Anthem AZ</div>
            <div id="az-temp" class="big-number">--°</div>
        </div>

        <!-- Riyadh Saudi Arabia Temp -->
        <div class="box">
            <div class="box-title">Riyadh Saudi</div>
            <div id="riyadh-temp" class="big-number">--°</div>
        </div>

        <!-- St Croix USVI Temp -->
        <div class="box">
            <div class="box-title">St Croix USVI</div>
            <div id="stcroix-temp" class="big-number">--°</div>
        </div>
    </div>

</div>

<script>
let newsItems = [];
let newsIndex = 0;

/* EXACT TEMPERATURE COLOR SYSTEM AS SPECIFIED IN IMAGE 3 */
function getTempColorClass(t) {
    if (t <= 59) return "t-cold";   /* White */
    if (t <= 69) return "t-cool";   /* Light Blue */
    if (t <= 79) return "t-yellow"; /* Yellow */
    if (t <= 89) return "t-orange"; /* Orange */
    if (t <= 99) return "t-lred";   /* Light Red */
    return "t-bred";                /* Bright Red >= 100 */
}

/* UPDATE LOCAL TIME DISPLAY */
function updateClock() {
    const timeStr = new Date().toLocaleTimeString("en-US", {
        timeZone: "America/New_York",
        hour: "2-digit",
        minute: "2-digit"
    });
    document.getElementById("local-time").innerText = timeStr.replace(/^0/, '');
}
setInterval(updateClock, 1000);

/* FETCH GLOBAL NEWS HEADLINES */
async function fetchNews() {
    try {
        let res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fnews%2Fworld%2Frss.xml");
        let data = await res.json();
        if (data.items && data.items.length > 0) {
            newsItems = data.items.map(i => i.title);
            cycleNews();
        }
    } catch(e) {
        newsItems = ["US & World Events updates stream active."];
        cycleNews();
    }
}

function cycleNews() {
    if (newsItems.length === 0) return;
    const ticker = document.getElementById("news-ticker");
    ticker.style.opacity = 0;
    setTimeout(() => {
        ticker.innerText = newsItems[newsIndex];
        ticker.style.opacity = 1;
        newsIndex = (newsIndex + 1) % newsItems.length;
    }, 400);
}
setInterval(cycleNews, 12000);

/* HURRICANE TRACKER ENGINE */
async function checkHurricaneTracker() {
    const statusBox = document.getElementById("caneStatus");
    const stormListBox = document.getElementById("caneStormList");
    const countdownBox = document.getElementById("caneCountdown");

    const now = new Date();
    const currentYear = now.getFullYear();
    let seasonStart = new Date(currentYear, 5, 1);
    let seasonEnd = new Date(currentYear, 10, 30, 23, 59, 59);

    if (now >= seasonStart && now <= seasonEnd) {
        const daysLeft = Math.ceil((seasonEnd - now) / (1000 * 60 * 60 * 24));
        countdownBox.innerHTML = `⏳ Season Ends in ${daysLeft} Days`;
    } else {
        if (now > seasonEnd) seasonStart = new Date(currentYear + 1, 5, 1);
        const daysUntil = Math.ceil((seasonStart - now) / (1000 * 60 * 60 * 24));
        countdownBox.innerHTML = `⏳ ${daysUntil} Days Until Season Start`;
    }

    try {
        let alertUrl = "https://api.weather.gov/alerts/active?event=Tropical%20Storm%20Warning,Tropical%20Storm%20Watch,Hurricane%20Warning,Hurricane%20Watch,Hurricane%20Local%20Statement";
        let res = await fetch(alertUrl);
        let data = await res.json();
        let features = data.features || [];

        let localRes = await fetch("https://api.weather.gov/alerts/active?zone=FLZ068");
        let localData = await localRes.json();
        let localFeatures = localData.features || [];

        if (localFeatures.length > 0) {
            statusBox.className = "alert-active";
            statusBox.innerHTML = `🚨 Local Warning Active!`;
        } else if (features.length > 0) {
            statusBox.className = "alert-active";
            statusBox.style.color = "#ff8c1a";
            statusBox.innerHTML = `⚠️ Active System Tracked`;
        } else {
            statusBox.className = "alert-quiet";
            statusBox.innerHTML = `✓ Basin Quiet`;
        }

        if (features.length > 0) {
            let uniqueEvents = [...new Set(features.map(f => f.properties.event))];
            stormListBox.innerHTML = "🌀 " + uniqueEvents.slice(0, 1).join("");
        } else {
            stormListBox.innerHTML = "🌀 No Active Threat";
        }
    } catch(e) {
        statusBox.className = "alert-quiet";
        statusBox.innerHTML = `✓ Basin Quiet`;
    }
}

/* FETCH ALL WEATHER DATA */
async function fetchWeatherData() {
    updateClock();
    checkHurricaneTracker();

    try {
        // 1. Deerfield Beach (Local)
        let r1 = await fetch("https://api.open-meteo.com/v1/forecast?latitude=26.3184&longitude=-80.0998&current=temperature_2m&hourly=temperature_2m,precipitation_probability&temperature_unit=fahrenheit&timezone=America/New_York&forecast_days=1");
        let d1 = await r1.json();

        if (d1.current) {
            let temp = Math.round(d1.current.temperature_2m);
            let localEl = document.getElementById("local-temp");
            localEl.innerText = temp + "°";
            localEl.className = "top-big-temp " + getTempColorClass(temp);
        }

        // 6-Hour Hourly Forecast Builder
        if (d1.hourly) {
            let container = document.getElementById("hourly-container");
            container.innerHTML = "";
            
            // Extract next 6 hours starting from current hour
            let currentHourIdx = new Date().getHours();
            for (let i = 0; i < 6; i++) {
                let idx = (currentHourIdx + i) % 24;
                let timeRaw = d1.hourly.time[idx].split("T")[1];
                let hourNum = parseInt(timeRaw.split(":")[0]);
                let ampm = hourNum >= 12 ? 'PM' : 'AM';
                let displayHour = (hourNum % 12 || 12) + ampm;
                
                let hTemp = Math.round(d1.hourly.temperature_2m[idx]);
                let pop = d1.hourly.precipitation_probability[idx];
                
                let hourBlock = document.createElement("div");
                hourBlock.className = "hourly-item";
                hourBlock.innerHTML = `
                    <div class="hourly-time">${displayHour}</div>
                    <div class="hourly-temp ${getTempColorClass(hTemp)}">${hTemp}°</div>
                    <div class="hourly-pop">☔${pop}%</div>
                `;
                container.appendChild(hourBlock);
            }
        }

        // 2. Anthem AZ
        let r2 = await fetch("https://api.open-meteo.com/v1/forecast?latitude=33.8674&longitude=-112.1465&current=temperature_2m&temperature_unit=fahrenheit");
        let d2 = await r2.json();
        if (d2.current) {
            let temp = Math.round(d2.current.temperature_2m);
            let azEl = document.getElementById("az-temp");
            azEl.innerText = temp + "°";
            azEl.className = "big-number " + getTempColorClass(temp);
        }

        // 3. Riyadh Saudi Arabia
        let r3 = await fetch("https://api.open-meteo.com/v1/forecast?latitude=24.6877&longitude=46.7219&current=temperature_2m&temperature_unit=fahrenheit");
        let d3 = await r3.json();
        if (d3.current) {
            let temp = Math.round(d3.current.temperature_2m);
            let riyadhEl = document.getElementById("riyadh-temp");
            riyadhEl.innerText = temp + "°";
            riyadhEl.className = "big-number " + getTempColorClass(temp);
        }

        // 4. St Croix USVI
        let r4 = await fetch("https://api.open-meteo.com/v1/forecast?latitude=17.7466&longitude=-64.7031&current=temperature_2m&temperature_unit=fahrenheit");
        let d4 = await r4.json();
        if (d4.current) {
            let temp = Math.round(d4.current.temperature_2m);
            let stcroixEl = document.getElementById("stcroix-temp");
            stcroixEl.innerText = temp + "°";
            stcroixEl.className = "big-number " + getTempColorClass(temp);
        }

    } catch(e) {
        console.log("Holding for next update cycle...", e);
    }
}

/* INITIALIZE PIPELINES */
fetchWeatherData();
fetchNews();

setInterval(fetchWeatherData, 300000); // 5 min weather refresh
setInterval(fetchNews, 900000);        // 15 min news refresh
</script>

</body>
</html>
